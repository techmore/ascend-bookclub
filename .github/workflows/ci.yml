name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: HTML validation + link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate HTML
        run: npx --yes html-validate@11.16.4 "**/*.html"
      - name: Check internal links and assets
        run: python3 scripts/check_links.py . --base-prefix /ascend-bookclub
